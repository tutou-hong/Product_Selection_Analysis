<html lang="zh-CN">

<title>直播复盘 · 加密分享页</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
       background:radial-gradient(1200px 700px at 20% -10%, #34507e 0%, #22304c 55%, #18243b 100%);
       color:#eaf0fb;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:420px;background:#ffffff;color:#1c2333;border-radius:20px;
        padding:36px 34px 30px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .lock{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#2b6de0,#1b4fae);
        display:flex;align-items:center;justify-content:center;margin-bottom:18px;font-size:26px}
  h1{font-size:20px;margin:0 0 6px;font-weight:800}
  .sub{font-size:13px;color:#6b7385;margin-bottom:22px;line-height:1.6}
  label{font-size:12px;color:#6b7385;display:block;margin-bottom:6px}
  .row{display:flex;gap:10px;margin-bottom:8px}
  input{flex:1;border:1.5px solid #e5e8f0;border-radius:10px;padding:11px 14px;font-size:15px;outline:none}
  input:focus{border-color:#2b6de0}
  button{border:0;border-radius:10px;background:#2b6de0;color:#fff;font-size:15px;padding:0 20px;cursor:pointer;font-weight:600}
  button:hover{background:#1b4fae}
  button:disabled{opacity:.6;cursor:default}
  .err{color:#d62839;font-size:12px;min-height:18px;margin-bottom:6px}
  .hint{font-size:11px;color:#9aa2b4;margin-top:14px;line-height:1.6;border-top:1px solid #eef1f6;padding-top:12px}
  .oknote{font-size:11px;color:#1c9e5a;margin-top:8px;min-height:16px}
  /* —— 解锁后的切换栏 —— */
  .bar{height:48px;background:#22304c;display:flex;align-items:center;gap:8px;padding:0 14px;flex-shrink:0}
  .bar .ttl{color:#8fa0c0;font-size:12px;margin-right:10px;white-space:nowrap}
  .bar button.tab{background:transparent;color:#cfd7ea;font-size:13px;padding:7px 14px;border-radius:8px;font-weight:600}
  .bar button.tab:hover{background:#37476b}
  .bar button.tab.on{background:#2b6de0;color:#fff}
  .bar .sp{flex:1}
  .bar button.lock{background:#37476b;color:#cfd7ea;font-size:12px;padding:6px 12px;border-radius:8px}
  .bar button.lock:hover{background:#46578a}
</style>
</head>

  function b64(bin){var s=atob(bin),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  function show(idx){
    var bar='<div class="bar"><span class="ttl">直播复盘</span>'
      + PAGES.map(function(p,i){return '<button class="tab'+(i===idx?' on':'')+'" data-i="'+i+'">'+p.n+'</button>';}).join('')
      + '<span class="sp"></span><button class="lock" id="lk">返回</button></div>'
      + '<iframe id="f" style="flex:1;width:100%;border:0;background:#f4f6fb"></iframe>';
    document.body.style.cssText='margin:0;padding:0;display:flex;flex-direction:column;height:100vh;width:100%;overflow:hidden;background:#f4f6fb';
    document.body.innerHTML=bar;
    document.getElementById('f').srcdoc=PAGES[idx].h;
    document.querySelectorAll('.bar .tab').forEach(function(b){
      b.addEventListener('click',function(){show(parseInt(b.getAttribute('data-i'),10));});
    });
    document.getElementById('lk').addEventListener('click',function(){location.reload();});
  }
  async function unlock(e){
    e.preventDefault();
    var pw=document.getElementById('pw').value;
    var go=document.getElementById('go'),err=document.getElementById('err'),ok=document.getElementById('ok');
    err.textContent='';ok.textContent='';
    if(!pw){err.textContent='请输入密码';return;}
    go.disabled=true;ok.textContent='正在解锁…';
    try{
      var enc=new TextEncoder();
      var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
      var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},km,256);
      var key=await crypto.subtle.importKey('raw',bits,{name:'AES-GCM'},false,['decrypt']);
      for(var i=0;i<PAGES.length;i++){
        var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAGES[i].i),tagLength:128},key,b64(PAGES[i].c));
        PAGES[i].h=new TextDecoder().decode(plain);
      }
      show(0);
    }catch(ex){
      go.disabled=false;ok.textContent='';
      err.textContent='密码不正确，无法解锁。';
      document.getElementById('pw').focus();
    }
  }
</script>
