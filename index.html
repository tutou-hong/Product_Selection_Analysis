  function b64(bin){var s=atob(bin),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  async function unlock(e){
    e.preventDefault();
    var pw=document.getElementById('pw').value;
    var go=document.getElementById('go');
    var err=document.getElementById('err');
    var ok=document.getElementById('ok');
    err.textContent='';ok.textContent='';
    if(!pw){err.textContent='请输入密码';return;}
    go.disabled=true;ok.textContent='正在解锁…';
    try{
      var enc=new TextEncoder();
      var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
      var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},km,256);
      var key=await crypto.subtle.importKey('raw',bits,{name:'AES-GCM'},false,['decrypt']);
      var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV),tagLength:128},key,b64(CIPH));
      var html=new TextDecoder().decode(plain);
      // 用解密出的完整页面替换当前文档（其内嵌脚本、图表、SVG、对比下拉框都会正常运行）
      document.open();document.write(html);document.close();
    }catch(ex){
      go.disabled=false;ok.textContent='';
      err.textContent='密码不正确，无法解锁。';
      document.getElementById('pw').focus();
    }
  }
</script>
