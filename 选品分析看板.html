<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>选品分析看板 · 需密钥</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#20304f 0%,#152036 55%,#0f1728 100%);
    color:#e8edf7;-webkit-font-smoothing:antialiased}
  .box{width:100%;max-width:392px;text-align:center}
  .lock{width:56px;height:56px;margin:0 auto 20px;border-radius:16px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
    display:flex;align-items:center;justify-content:center;font-size:25px}
  h1{margin:0 0 8px;font-size:19px;font-weight:800;letter-spacing:.3px}
  .sub{margin:0 0 26px;font-size:13px;line-height:1.75;color:#94a3c0}
  form{display:flex;flex-direction:column;gap:11px}
  input{
    width:100%;padding:13px 15px;font-size:15px;font-family:inherit;color:#e8edf7;
    background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.15);
    border-radius:11px;outline:none;transition:.16s;letter-spacing:1px}
  input::placeholder{color:#6d7d9c;letter-spacing:0}
  input:focus{border-color:#4a7fe8;background:rgba(74,127,232,.1);box-shadow:0 0 0 3px rgba(74,127,232,.17)}
  button{
    width:100%;padding:13px;font-size:15px;font-weight:700;font-family:inherit;color:#fff;
    background:#2b6de0;border:none;border-radius:11px;cursor:pointer;transition:.16s}
  button:hover:not(:disabled){background:#4a83e8}
  button:disabled{opacity:.55;cursor:default}
  .msg{min-height:20px;margin-top:15px;font-size:13px;line-height:1.7}
  .err{color:#ff9f9f}
  .warn{margin-top:26px;font-size:11.5px;line-height:1.75;color:#6d7d9c}
  .spin{display:inline-block;width:13px;height:13px;margin-right:7px;vertical-align:-2px;
    border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;
    animation:r .7s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .hide{display:none}
</style>
</head>
<body>
<div class="box">
  <div class="lock">🔒</div>
  <h1>选品分析看板</h1>
  <p class="sub">该页面已加密，请输入密钥查看。</p>
  <form id="f">
    <input id="p" type="password" placeholder="请输入密钥" autocomplete="current-password"
           autofocus spellcheck="false">
    <button id="b" type="submit">打开</button>
  </form>

  var ITER = PAYLOAD.iter;

  var f = document.getElementById('f');
  var p = document.getElementById('p');
  var b = document.getElementById('b');
  var m = document.getElementById('m');

  function unb64(s) {
    var bin = atob(s);
    var u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }

  function fail(text) {
    m.className = 'msg err';
    m.textContent = text;
    b.disabled = false;
    b.textContent = '打开';
    p.select();
  }

  // Safari / 老版本可能在非 https 下没有 crypto.subtle
  if (!(window.crypto && window.crypto.subtle)) {
    fail('当前浏览器在此环境下不支持解密。请改用 Chrome 打开本文件。');
    p.disabled = true; b.disabled = true;
    return;
  }

  async function unlock(pw) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: unb64(PAYLOAD.salt), iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    var buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(PAYLOAD.iv) }, key, unb64(PAYLOAD.ct));
    return new TextDecoder().decode(buf);
  }

  f.addEventListener('submit', async function (e) {
    e.preventDefault();
    var pw = p.value;
    if (!pw) { fail('请输入密钥。'); return; }
    b.disabled = true;
    b.innerHTML = '<span class="spin"></span>解密中';
    m.className = 'msg'; m.textContent = '';
    try {
      var html = await unlock(pw);
      // 用写文档的方式接管当前页：不产生新的明文文件，URL 也不变
      document.open();
      document.write(html);
      document.close();
    } catch (err) {
      // AES-GCM 校验失败 = 密钥不对（和内容被改动）在密码学上不可区分
      fail('密钥不正确，或文件已损坏。');
    }
  });
